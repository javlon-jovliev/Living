<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Living — atrofingizdagi ish stoli</title>
<style>
:root{--bg1:#f3f0ea;--bg2:#d9d4c8}
@media (prefers-color-scheme:dark){:root{--bg1:#25241f;--bg2:#0d0d0c}}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(var(--bg1),var(--bg2));font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<video id="vid" playsinline muted></video>
<script>
/* ================= 3D: birinchi shaxs ko'rinishi (kutubxonasiz) ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR,F=400,CYP=300,BAR=120,now=performance.now();
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const INK=dark?'#ecebe6':'#1d1d1b',MUTE=dark?'#9b988f':'#6f6c64',CARD=dark?'#24231f':'#fffdf8',LINE=dark?'#34332e':'#ddd8cc',OK='#2e8b62',BAD='#c4473a';
const EYE=1.75,DH=.75,R1=2.25,R2=4.35;
const DESKS=[{x:0,z:0,top:'#d8ccb6',side:'#b9ab92'},{x:24,z:-16,top:'#c8d3dc',side:'#9fb0be'},{x:-24,z:-16,top:'#d5cfe2',side:'#ada5c3'}];
const cam={x:0,y:EYE,z:0,yaw:0,pitch:-.2,pt:null,gx:0,gz:0,desk:0,pos:[0,0,0],f:[0,0,-1],r:[1,0,0],u:[0,1,0]};
const wideL=()=>W>=760;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 BAR=(wideL()?1:2)*(wideL()?100:92)+30;F=W<H?Math.min(W/2/.55,(H-BAR)*.9):Math.min(W/2,(H-BAR)*1.1);CYP=(H-BAR)*(W<H?.45:.5)}
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
function updCam(){const cp=Math.cos(cam.pitch);cam.f=[-Math.sin(cam.yaw)*cp,Math.sin(cam.pitch),-Math.cos(cam.yaw)*cp];cam.r=norm(cross(cam.f,[0,1,0]));cam.u=cross(cam.r,cam.f);cam.pos=[cam.x,cam.y,cam.z]}
// silindrik proyeksiya: atrofdagi halqa chetlarda cho'zilmaydi
function proj(p){const d=sub(p,cam.pos),x=dot(d,cam.r),z=dot(d,cam.f),h=Math.hypot(x,z);if(h<.15)return null;const th=Math.atan2(x,z);if(Math.abs(th)>1.45)return null;return[W/2+th*F,CYP-dot(d,cam.u)/h*F,h]}
function rayAt(sx,sy,y0){const th=(sx-W/2)/F,Y=-(sy-CYP)/F;const dir=norm(add(add(mul(cam.f,Math.cos(th)),mul(cam.r,Math.sin(th))),mul(cam.u,Y)));if(Math.abs(dir[1])<1e-3)return null;const t=(y0-cam.pos[1])/dir[1];if(t<0||t>60)return null;return add(cam.pos,mul(dir,t))}
const LIGHT=norm([-.4,1,.45]);const cc={};
function rgb(h){if(cc[h])return cc[h];const n=parseInt(h.slice(1),16);return cc[h]=[n>>16,n>>8&255,n&255]}
function shade(h,k,a){const c=rgb(h);return`rgba(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0},${a})`}
function boxP(cx,cy,cz,w,h,d,ry=0){const hw=w/2,hd=d/2,c=Math.cos(ry),s=Math.sin(ry);const P=(x,y,z)=>[cx+x*c+z*s,cy+y,cz-x*s+z*c];
 const p=[P(-hw,0,-hd),P(hw,0,-hd),P(hw,0,hd),P(-hw,0,hd),P(-hw,h,-hd),P(hw,h,-hd),P(hw,h,hd),P(-hw,h,hd)];
 return{faces:[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]].map(f=>f.map(i=>p[i])),c:[cx,cy+h/2,cz],top:cy+h}}
function cylP(cx,cy,cz,r,h,n=10,axis='y'){const b=[],t=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,u=Math.cos(a)*r,v=Math.sin(a)*r;
  if(axis==='y'){b.push([cx+u,cy,cz+v]);t.push([cx+u,cy+h,cz+v])}else{b.push([cx-h/2,cy+u,cz+v]);t.push([cx+h/2,cy+u,cz+v])}}
 const faces=[b.slice().reverse(),t];for(let i=0;i<n;i++){const j=(i+1)%n;faces.push([b[i],b[j],t[j],t[i]])}return{faces,c:axis==='y'?[cx,cy+h/2,cz]:[cx,cy,cz],top:axis==='y'?cy+h:cy+r}}
const part=(g,color,alpha=1,glow=0)=>({faces:g.faces,c:g.c,top:g.top,color,alpha,glow});

/* ================= ma'lumot va "kimyo" ================= */
const MON=['Sen','Okt','Noy'];
const C={money:'#2e8b62',time:'#3a6fc4',msg:'#8b62c4',work:'#d0802a',hot:'#e2582a'};
const MSH=['#2b7a57','#3c9c70','#5cbb8e'];
const CAT={'Ijara':'#2b7a57','Oziq-ovqat':'#4fae82','Transport':'#86cfa8','Internet':'#2f6f8f','Elektr':'#b5a33a','Telefon':'#6aa84f','Kafe':'#9ccc65','Kitoblar':'#4f8a6e'};
const clone=o=>JSON.parse(JSON.stringify(o));
const money=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mln':String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const dueTxt=d=>d<=0?'bugun':d===1?'ertaga':d+' kundan keyin';
const count=b=>b.data.items?b.data.items.length:1;
function sum(b){if(b.type==='invoice')return b.data.amt;if(b.type==='expenses'||b.type==='chart')return b.data.items.reduce((s,i)=>s+i.amt,0);return 0}
function heat(b){if(b.type==='tasks'||b.type==='plan'){if(!b.data.items.length)return 0;const m=Math.min(...b.data.items.map(i=>i.due));return m<=1?1:m<=2?.55:0}if(b.type==='email')return b.data.task.due<=1?.8:.45;return 0}
const BASE={expenses:{w:1.1,r:.62},invoice:{w:.62,r:.36},time:{w:1.35,r:.62},email:{w:.9,r:.48},tasks:{w:.82,r:.45},note:{w:.62,r:.34},chart:{w:1.7,r:.95},plan:{w:1.7,r:.95}};
const mass=b=>b.r*b.r*(1+sum(b)/4e6);
const Rl={};const rule=(a,b,d)=>Rl[a+'+'+b]=d;
const addInv=type=>({kind:'make',make:(x,i)=>({type,data:{items:[...clone(x.data.items),{t:i.data.t,amt:i.data.amt,m:i.data.m}]}})});
rule('expenses','time',{kind:'make',make:e=>({type:'chart',data:{items:clone(e.data.items)}})});
rule('expenses','invoice',addInv('expenses'));rule('chart','invoice',addInv('chart'));
rule('expenses','expenses',{kind:'make',make:(a,b)=>({type:'expenses',data:{items:[...clone(a.data.items),...clone(b.data.items)]}})});
rule('tasks','email',{kind:'make',make:(t,e)=>({type:'tasks',data:{items:[...clone(t.data.items),clone(e.data.task)]}})});
rule('plan','email',{kind:'make',make:(t,e)=>({type:'plan',data:{items:[...clone(t.data.items),clone(e.data.task)]}})});
rule('tasks','time',{kind:'make',make:t=>({type:'plan',data:{items:clone(t.data.items)}})});
rule('tasks','tasks',{kind:'make',make:(a,b)=>({type:'tasks',data:{items:[...clone(a.data.items),...clone(b.data.items)]}})});
for(const[a,b]of[['expenses','email'],['chart','email'],['tasks','invoice'],['plan','invoice'],['expenses','tasks'],['chart','tasks'],['expenses','plan'],['chart','plan'],['time','email'],['time','invoice'],['chart','time'],['plan','time']])rule(a,b,{kind:'reject'});
function getRule(a,b){let r=Rl[a.type+'+'+b.type];if(r)return{r,first:a,second:b};r=Rl[b.type+'+'+a.type];if(r)return{r,first:b,second:a};return null}

/* ===== shakllar: yozuvsiz, o'zi nimaligini ko'rsatadi; old tomoni (+z) foydalanuvchiga qaraydi ===== */
function build(b){const{type,data}=b,P=[];
 if(type==='expenses'){ // pul pachkasi: har varaq bitta xarajat, qalinligi summaga teng
  let y=0;data.items.slice().sort((a,c)=>a.m-c.m).forEach((it,i)=>{const h=.06+it.amt/4e6*.22;P.push(part(boxP(0,y,0,1.1,h,.56,i%2?.05:-.04),MSH[it.m]));y+=h+.015});
  P.push(part(boxP(0,y,0,.5,.012,.3,.0),'#a8d9bd'));P.push(part(boxP(0,0,0,.16,y+.015,.6),'#efe6cc'))}
 else if(type==='invoice'){ // chek: qatorlar va pastdagi yashil jami chizig'i (uzunligi summaga teng)
  P.push(part(boxP(0,0,0,.6,.9,.03),'#f6f3ea'));for(let k=0;k<4;k++)P.push(part(boxP(-.05,.72-k*.12,.02,.42-k%2*.1,.035,.015),'#cfcabe'));
  const w=.08+Math.min(.42,b.data.amt/1e6*.5);P.push(part(boxP(-.22+w/2,.1,.02,w,.09,.02),'#2e8b62'));
  for(let k=0;k<5;k++)P.push(part(boxP(-.24+k*.12,-.03,0,.06,.04,.03,.785),'#f6f3ea'))}
 else if(type==='time'){ // stol kalendari: halqalar, oylar, kunlar; cho'zilsa ko'proq kun ko'rsatadi
  const n=Math.max(3,Math.min(28,Math.round(7*b.s[0]))),rows=n>14?Math.ceil(n/7):1,cols=rows>1?7:n,tw=.17,gap=.025,w=cols*(tw+gap)+.1;
  P.push(part(boxP(0,0,0,w,.07,.42),'#2f5ea8'));
  for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols);P.push(part(boxP(-w/2+.05+tw/2+c*(tw+gap),.07+r*.21,0,tw,.18,.05),i===0?C.hot:i<7?'#e6edf8':'#d3dff2'))}
  const ty=.07+rows*.21;P.push(part(boxP(0,ty,0,w,.2,.07),'#3a6fc4'));
  for(let k=0;k<2;k++)P.push(part(cylP(-w/4+k*w/2,ty+.2,0,.035,.12,8),'#9aa4b2'))}
 else if(type==='email'){ // konvert: ichidagi ish kartasi tepadan chiqib turadi
  const hot=data.task.due<=1;P.push(part(boxP(0,.3,-.01,.56,.5,.02),hot?C.hot:C.work,1,hot?1:0));
  P.push(part(boxP(0,.02,0,.9,.6,.07),'#c4b0e2'));
  P.push({faces:[[[-.45,.62,.04],[.45,.62,.04],[0,.27,.04]]],c:[0,.4,0],top:.62,color:'#8b62c4',alpha:1,glow:0})}
 else if(type==='tasks'){ // qisqichli nazorat taxtasi: har qator bitta vazifa; cho'zilsa bo'sh qatorlar ochiladi
  const its=data.items.slice().sort((a,c)=>a.due-c.due),cap=Math.max(its.length,Math.round((its.length+1)*b.s[1])),h=.3+cap*.2;
  P.push(part(boxP(0,0,0,.82,h,.04),'#a5835c'));P.push(part(boxP(0,.02,.025,.72,h-.12,.01),'#f7f1e4'));P.push(part(boxP(0,h-.06,.02,.3,.1,.07),'#8d8a82'));
  for(let i=0;i<cap;i++){const y=h-.3-i*.2,it=its[i],hot=it&&it.due<=1;P.push(part(boxP(-.26,y,.035,.1,.1,.03),it?(hot?C.hot:C.work):'#e3dccd',1,hot?1:0));if(it)P.push(part(boxP(.08,y+.03,.035,.44,.045,.02),hot?'#f0a688':'#cbb795'))}}
 else if(type==='note'){P.push(part(boxP(0,0,0,.62,.62,.02,.05),'#f2d75c'));for(let k=0;k<3;k++)P.push(part(boxP(0,.44-k*.12,.015,.42-k*.08,.03,.012,.05),'#c7ad3c'))}
 else if(type==='chart'){ // ustunli grafik: har ustun bir oy (ko'k asos), har bo'lak bitta xarajat
  P.push(part(boxP(0,0,0,1.7,.06,.8),'#e1eee6'));
  for(let m=0;m<3;m++){P.push(part(boxP((m-1)*.55,0,.36,.44,.1,.1),['#2f5ea8','#3a6fc4','#5b8fe0'][m]));
   let y=.06;data.items.filter(i=>i.m===m).forEach(it=>{const h=.12+it.amt/4e6*.62;P.push(part(boxP((m-1)*.55,y,0,.36,h,.36),CAT[it.t]||'#6fbf95'));y+=h+.015})}}
 else if(type==='plan'){ // devor rejasi: 7 kun ustuni
  P.push(part(boxP(0,0,0,1.7,1.05,.04),'#f6efe3'));P.push(part(boxP(0,.94,.03,1.62,.08,.02),C.time));
  for(let d=0;d<7;d++)P.push(part(boxP(-.69+d*.23,.8,.03,.19,.09,.02),d<=1?'#f0b49a':'#dfe8f7'));
  const per={};data.items.forEach(it=>{const d=Math.min(6,it.due);per[d]=(per[d]||0)+1;const hot=it.due<=1;P.push(part(boxP(-.69+d*.23,.7-per[d]*.16,.03,.19,.13,.04),hot?C.hot:C.work,1,hot?1:0))})}
 return P}
const OS=.72;function geoScale(b){const g=b.type==='time'?[1,b.s[1],b.s[2]]:b.type==='tasks'?[b.s[0],1,b.s[2]]:b.s;return g.map(v=>v*OS)}
function rebuild(b){b.parts=build(b);const g=geoScale(b);b.top=Math.max(...b.parts.map(p=>p.top))*g[1];
 const wx=(b.type==='time'?Math.max(...b.parts.flatMap(p=>p.faces.flat().map(v=>Math.abs(v[0]))))*2:BASE[b.type].w*b.s[0])*OS;b.w=wx;b.r=Math.max(BASE[b.type].r*Math.max(g[0],g[2]),b.type==='time'?wx*.46:0)}
function itemsOf(b){const d=b.data;
 if(b.type==='expenses'||b.type==='chart')return d.items.slice().sort((a,c)=>c.m-a.m).map(i=>({t:`${MON[i.m]} · ${i.t}  ${money(i.amt)}`,c:CAT[i.t]||MSH[i.m]}));
 if(b.type==='invoice')return[{t:d.from,c:'#9b978c'},{t:`${d.t} · ${MON[d.m]}  ${money(d.amt)} so'm`,c:'#2e8b62'}];
 if(b.type==='time'){const n=Math.max(3,Math.min(28,Math.round(7*b.s[0])));return[{t:MON.join(' · '),c:C.time},{t:`Bugundan ${n} kun`,c:C.hot}]}
 if(b.type==='email')return[{t:`${d.from}: «${d.text}»`,c:C.msg},{t:`${d.task.t} — ${dueTxt(d.task.due)}`,c:d.task.due<=1?C.hot:C.work}];
 if(b.type==='tasks'||b.type==='plan')return d.items.slice().sort((a,c)=>a.due-c.due).map(i=>({t:`${i.t} — ${dueTxt(i.due)}`,c:i.due<=1?C.hot:C.work}));
 if(b.type==='note')return[{t:d.text,c:'#f2d75c'}];return[]}

/* ================= obyektlar va ish stollari ================= */
let bodies=[],nid=1,undoStack=[];
function onDesk(k,th,rr=3.3){const D=DESKS[k];return[D.x+Math.sin(th)*rr,D.z-Math.cos(th)*rr]}
function mk(type,data,x,z,desk,hist){const b={id:nid++,type,data,x,z,desk,y:0,vx:0,vz:0,vy:0,hist:hist||null,pop:0,flash:0,shake:0,cool:0,open:0,isOpen:false,gone:false,s:[1,1,1],hover:null};rebuild(b);return b}
const at=(type,data,k,th)=>{const[x,z]=onDesk(k,th);return mk(type,data,x,z,k)};
function seed(){bodies=[
 at('expenses',{items:[{t:'Ijara',amt:4000000,m:0},{t:'Oziq-ovqat',amt:2100000,m:0},{t:'Ijara',amt:4000000,m:1},{t:'Oziq-ovqat',amt:2600000,m:1},{t:'Transport',amt:600000,m:1},{t:'Ijara',amt:4000000,m:2},{t:'Oziq-ovqat',amt:1900000,m:2}]},0,-.62),
 at('invoice',{t:'Internet',amt:350000,m:2,from:'Uzonline'},0,-.31),
 at('time',{},0,0),
 at('email',{from:'Ali',text:"Hisobotni juma kunigacha yuborib qo'y",task:{t:'Hisobotni Aliga yuborish',due:2}},0,.31),
 at('tasks',{items:[{t:"Soliq to'lovi",due:1},{t:"Mijozga qo'ng'iroq",due:4}]},0,.62),
 at('note',{text:"Yangi loyiha uchun g'oya"},0,1.05),
 at('email',{from:'Rahbar',text:"Ertangi taqdimotni tayyorlang",task:{t:'Taqdimot tayyorlash',due:1}},1,-.5),
 at('tasks',{items:[{t:'Kod tekshiruvi',due:3},{t:'Hisobot',due:5}]},1,0),
 at('time',{},1,.55),at('note',{text:'Uchrashuv gʻoyalari'},1,1.05)];
 bodies.forEach((b,i)=>b.pop=-i*.1)}
const LIB=[{type:'invoice',data:{t:'Elektr',amt:280000,m:2,from:'Elektr tarmogʻi'}},{type:'email',data:{from:'Dilnoza',text:'Ertaga 10:00 da uchrashamizmi?',task:{t:'Dilnoza bilan uchrashuv',due:1}}},
 {type:'expenses',data:{items:[{t:'Kafe',amt:450000,m:2},{t:'Kitoblar',amt:300000,m:1}]}},{type:'tasks',data:{items:[{t:'Kitobni qaytarish',due:5}]}},{type:'time',data:{}},{type:'note',data:{text:"Bo'sh eslatma"}}];
const shelves=DESKS.map((D,k)=>{const[x,z]=onDesk(k,Math.PI);return{x,z,k}});
const minis=[];shelves.forEach(sh=>LIB.forEach((it,i)=>{const m={it,i,sh,x:0,z:0,y:0,s:[1,1,1],type:it.type,data:it.data};m.parts=build(m);minis.push(m)}));
const shelfParts=[part(cylP(0,0,0,.55,.3,8),'#b9b4a8'),part(cylP(0,.3,0,.48,.04,8),'#d6d1c4')];
function snapshot(){undoStack.push(bodies.filter(b=>!b.gone).map(b=>({type:b.type,data:clone(b.data),x:b.x,z:b.z,desk:b.desk,s:b.s.slice(),hist:b.hist?clone(b.hist):null})));if(undoStack.length>40)undoStack.shift()}
function undo(){flash('palm');const s=undoStack.pop();if(!s)return;bodies=s.map(o=>{const b=mk(o.type,o.data,o.x,o.z,o.desk,o.hist);b.s=o.s;rebuild(b);b.pop=.5;return b});held=thrown=null}
const strip=b=>({type:b.type,data:clone(b.data),hist:b.hist?clone(b.hist):null});
function merge(a,o,g){snapshot();const res=g.r.make(g.first,g.second);
 const b=mk(res.type,res.data,(a.x+o.x)/2,(a.z+o.z)/2,a.desk,[strip(g.first),strip(g.second)]);b.y=Math.max(a.y,o.y);b.pop=.5;b.flash=1;b.cool=held===a?1e15:now+600;
 bodies=bodies.filter(x=>x!==a&&x!==o);bodies.push(b);if(held===a){held=b;grab.dx=a.x-hp[0];grab.dz=a.z-hp[2];b.x=a.x;b.z=a.z}thrown=null}
function split(b){if(!b.hist)return;flash('shake');snapshot();const[p,q]=b.hist;const ax=cam.r[0],az=cam.r[2];
 const A=mk(p.type,p.data,b.x-ax*b.r,b.z-az*b.r,b.desk,p.hist),B=mk(q.type,q.data,b.x+ax*b.r,b.z+az*b.r,b.desk,q.hist);
 A.vx=-ax*.12;A.vz=-az*.12;B.vx=ax*.12;B.vz=az*.12;A.pop=B.pop=.5;A.cool=B.cool=now+900;A.y=B.y=b.y;A.flash=B.flash=1;
 bodies=bodies.filter(x=>x!==b);bodies.push(A,B);held=null;mode=null}
function discard(b){flash('throw');snapshot();b.gone=true;b.isOpen=false;b.vy=.12;const s=Math.hypot(b.vx,b.vz)||1;b.vx=b.vx/s*.35;b.vz=b.vz/s*.35}
function goDesk(k){k=(k+DESKS.length)%DESKS.length;if(k===cam.desk&&Math.hypot(cam.x-DESKS[k].x,cam.z-DESKS[k].z)<.1)return;cam.desk=k;cam.gx=DESKS[k].x;cam.gz=DESKS[k].z;bodies.forEach(b=>b.isOpen=false)}
function dolly(d){const nx=cam.x-Math.sin(cam.yaw)*d,nz=cam.z-Math.cos(cam.yaw)*d,D=DESKS[cam.desk],dd=Math.hypot(nx-D.x,nz-D.z);if(dd<9){cam.x=nx;cam.z=nz;cam.gx=nx;cam.gz=nz}}

/* ========== boshqaruv: sichqoncha, sensor va qo'l bir xil yo'ldan o'tadi ========== */
let planeY=1.2,held=null,thrown=null,thrownAt=0,grab={dx:0,dz:0},hp=[0,0,0],trail=[],downAt=0,downPos=null,moved=false,mode=null,lookLast=null,flips=[],lastSign=0,src='mouse',st=null;
